[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "codespell>=2.4.2",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
colab_gpu = [
    "torch>=2.0.0",
    "rustbpe",
    "tiktoken",
    "pyarrow",
    "requests",
    "google-genai",
    "kernels",
    "matplotlib",
    "pandas",
]
colab_tpu = [
    "torch>=2.0.0",
    "torch_xla[tpu]>=2.5.0",
    "rustbpe",
    "tiktoken",
    "pyarrow",
    "requests",
    "google-genai",
    "kernels",
    "matplotlib",
    "pandas",
]

[tool.setuptools]
packages = []
py-modules = []
